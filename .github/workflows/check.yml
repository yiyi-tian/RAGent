name: 项目检查

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libjson-c-dev libcurl4-openssl-dev
          python -m pip install -e '.[dev]'
      - name: Python 静态检查
        run: |
          python -m compileall -q python rag tools tests
          pyright --pythonpath "$(command -v python)"
          black --check python rag tools tests
      - name: 构建与回归
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE="$(command -v python)"
          cmake --build build -j 2
          ctest --test-dir build --output-on-failure
